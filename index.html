<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SJPCT兩年讀經進度靈修隨身本</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1C2938">

    <script src="data.js"></script>

    <style>
         :root {
            --bg-color: #1C2938;   /* 全部背景 */    
            --card-color: #2A3B4C;   /* 格子 */  
            --text-color: #F4F1EA;   /* 文字 */
            --accent-color: #E07A5F;   /* 強調色 */
            --secondary-color: #4A6076;   /* 次要顏色 */
            --success-color: #7CA982;   /* 成功顏色 */
            --nav-bg: #15202B;         /* 導覽列顏色 */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }

        header { 
            padding: 15px; 
            text-align: center; 
            background: var(--card-color); 
            border-bottom: 1px solid var(--secondary-color); 
            font-weight: bold; 
            font-size: 1.1rem; 
        }

        main { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        
        .page { display: none; padding: 15px; animation: fadeIn 0.2s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 通用導覽列 (月曆與日記) */
        .calendar-nav, .diary-nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        .nav-arrow { 
            background: var(--card-color); border: 1px solid var(--secondary-color); 
            border-radius: 50%; width: 40px; height: 40px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            color: var(--accent-color);
        }

        /* 月曆網格 */
        .calendar-grid { 
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; 
            background: rgba(42, 59, 76, 0.5); padding: 10px; border-radius: 18px; 
        }

        .weekday { text-align: center; font-size: 0.9rem; font-weight: bold; color: var(--accent-color); padding: 5px 0; }
        
        .day-cell { 
            background: var(--card-color); aspect-ratio: 1; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; font-weight: bold; position: relative; cursor: pointer;
            transition: all 0.2s ease;
        }

        /* 滑鼠移過去時的反白效果 */
        .day-cell:not(.empty):hover {
            background-color: var(--secondary-color); /* 懸停時變鋼鐵藍 */
            color: var(--accent-color); /* 文字變橘色 */
            filter: brightness(1.15); /* 稍微變亮 */
            transform: scale(1.05); /* 輕微放大 */
        }

        .day-cell.today { border: 2.5px solid var(--accent-color); font-weight: bold; color: var(--accent-color); }
        .day-cell.empty { background: transparent; cursor: default; }

        .day-cell.done { 
            background-color: var(--success-color); 
            color: white; 
            border: none;
        }
        .day-cell.today.done {
            border: 2.5px solid var(--accent-color);
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.3);
        }

        /* 彈窗 Modal */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; 
        }
        .modal-content { 
            background: var(--bg-color); width: 100%; max-width: 320px; padding: 25px 30px; 
            border-radius: 25px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            border: 1px solid var(--secondary-color);
        }
        .btn-action { 
            color: white; border: none; padding: 14px; 
            border-radius: 15px; margin-top: 12px; width: 100%; font-size: 1rem; cursor: pointer; font-weight: bold;
        }
        /* 閱讀按鈕：亮橘色 */
        .btn-read { background: var(--accent-color); }

        /* 新增日記按鈕：使用深藍色 */
        .btn-diary-go { background: #3E5C76; }

        /* 完成按鈕：預設為鋼鐵藍，完成後會變鼠尾草綠 */
        .btn-complete { background: var(--secondary-color); }
        .btn-complete.is-done { background: var(--success-color); }

        /* 底部導航 */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 75px; 
            background: var(--nav-bg); display: flex; justify-content: space-around; 
            align-items: center; padding: 0 10px;
            border-top: 2px solid var(--secondary-color); 
        }

        .nav-item { 
            border: none; 
            background: rgba(255, 255, 255, 0.05); /* 沒選中時 */
            font-size: 1.1rem; 
            font-weight: bold;
            color: var(--text-color); 
            opacity: 0.5;
            cursor: pointer; 
            height: 50px; 
            width: 30%; 
            border-radius: 10px;
            transition: 0.1s;
        }

        /* 選中的按鈕 */
        .nav-item.active-nav { 
            opacity: 1; color: white; background: var(--accent-color);
        }

        /* 聖經與日記區 */
        .bible-container { 
            background: var(--card-color); border-radius: 20px; padding: 20px; border: 1px solid var(--secondary-color); 
            line-height: 1.8; 
            font-size: 1.05rem; /* 設定初始字體大小為正常 */
        }
        /* 確保內文段落放大時，上下間距也能自動撐開，保持閱讀舒適度 */
        #bible-body p { margin: 14px 0; }
        .verse-num { color: var(--secondary-color); font-size: 0.8rem; margin-right: 6px; vertical-align: super; }
        .chap-title { color: var(--accent-color); border-bottom: 1px solid var(--secondary-color); padding: 20px 0 5px 0; margin-top: 0; }
        
        textarea { 
            width: 100%; height: 340px; border: 1px solid var(--secondary-color); 
            border-radius: 20px; padding: 20px; background: var(--card-color); 
            font-size: 1.05rem; outline: none; resize: none; color: var(--text-color); 
        }
    </style>
</head>
<body>

<header id="main-header">SJPCT 兩年讀經進度</header>

<main>
    <section id="bible" class="page">
        <div class="bible-container">
            <h3 id="bible-title" style="margin-top:0; color:var(--accent-color);">請選擇日期</h3>
        
            <div style="margin-bottom: 12px; display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 10px;">
                <span style="font-size: 0.9rem; color: var(--secondary-color); font-weight: bold;">字體大小：</span>
                <button id="font-btn-normal" style="background: var(--accent-color); color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s;" onclick="changeBibleFontSize('1.05rem', 'normal')">正常</button>
                <button id="font-btn-large" style="background: var(--secondary-color); color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s;" onclick="changeBibleFontSize('1.35rem', 'large')">放大</button>
                <button id="font-btn-xlarge" style="background: var(--secondary-color); color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s;" onclick="changeBibleFontSize('1.65rem', 'xlarge')">特大</button>
            </div>

            <div style="margin-bottom: 15px; display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 10px;">
                <span style="font-size: 0.9rem; color: var(--secondary-color); font-weight: bold;">手動查詢：</span>
                <input type="text" id="bible-search-input" placeholder="例如：創 1 或 約 3-4" style="flex: 1; background: var(--bg-color); border: 1px solid var(--secondary-color); border-radius: 6px; padding: 6px 10px; color: white; font-size: 0.95rem; outline: none;">
                <button style="background: var(--accent-color); color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem;" onclick="searchBibleCustom()">查詢</button>
            </div>

            <div id="bible-body">點擊月曆中的日期，即可在此閱讀經文內容。</div>
        </div>
    </section>

    <section id="home" class="page active">
        <div class="calendar-nav">
            <button class="nav-arrow" onclick="changeMonth(-1)">‹</button>
            <span id="cal-label" style="font-size: 1.2rem; font-weight: bold;">2026年 5月</span>
            <button class="nav-arrow" onclick="changeMonth(1)">›</button>
        </div>
        <div class="calendar-grid" id="calendar-body"></div>
    </section>

    <section id="diary" class="page">
        <div class="diary-nav">
            <button class="nav-arrow" onclick="changeDiaryDate(-1)">‹</button>
            <span id="diary-date-label" style="font-size: 1.2rem; font-weight: bold; color: var(--accent-color);">2026年 5月19日</span>
            <button class="nav-arrow" onclick="changeDiaryDate(1)">›</button>
        </div>
        <textarea id="diary-box" placeholder="寫下這日的心得或禱告" oninput="saveDiaryContent()"></textarea>
        
        <div style="margin-top: 15px; text-align: center; font-size: 1.2rem; color: var(--accent-color); line-height: 1.5; font-weight: bold;">
            提醒您，若您刪除瀏覽資料，所有已儲存的日記內容將清空<br>
            若有需要存留請自行點擊以下按鈕儲存文字檔
        </div>
        
        <button class="btn-action btn-read" style="margin-top: 8px;" onclick="downloadDiaryAsFile()">將今日日記匯出成文字檔</button>
    </section>
</main>

<div class="modal" id="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="modal-date" style="margin-top: 0;">日期</h2>
        <div id="modal-reading" style="font-size: 1.6rem; margin: 15px 0; font-weight: bold; color: var(--accent-color);">載入中...</div>
        
        <!-- 按鈕群 -->
        <button class="btn-action btn-read" onclick="switchToBible()">前往閱讀經文</button>
        <button class="btn-action btn-diary-go" onclick="switchToDiary()">撰寫今日靈修日記</button>
        <button id="modal-btn" class="btn-action btn-complete" onclick="toggleComplete()">標記為已達成</button>
        
        <p style="margin-top: 20px; margin-bottom: 0; color: var(--secondary-color); font-weight: bold; cursor: pointer; font-size: 0.95rem;" onclick="closeModal()">關閉視窗</p>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-item" id="nav-bible" onclick="switchPage('bible', this)">閱讀</button>
    <button class="nav-item active-nav" id="nav-home" onclick="switchPage('home', this)">進度</button>
    <button class="nav-item" id="nav-diary" onclick="switchPage('diary', this)">日記</button>
</nav>

<script>
    const biblePlan = {};
    const now = new Date();
    
    let viewYear = now.getFullYear();
    let viewMonth = now.getMonth() + 1;
    let selectedDay = now.getDate();
    let diaryDate = new Date();

    // 初始化讀經進度資料
    function initData() {
        if (typeof rawBibleData === 'undefined') {
            console.error("錯誤：找不到 rawBibleData。請檢查 data.js 是否存在。");
            return;
        }
        rawBibleData.trim().split('\n').forEach(line => {
            const [m, d, content] = line.split('|');
            if(!biblePlan[m]) biblePlan[m] = {};
            biblePlan[m][d] = content;
        });
    }

    // 渲染月曆網格
    function renderCalendar() {
        const grid = document.getElementById('calendar-body');
        grid.innerHTML = "";
        
        const weeks = ['日', '一', '二', '三', '四', '五', '六'];
        weeks.forEach(w => grid.innerHTML += `<div class="weekday">${w}</div>`);

        const firstDay = new Date(viewYear, viewMonth - 1, 1).getDay(); /* 算出這個月一號是星期幾就畫幾個空格 */
        const daysInMonth = new Date(viewYear, viewMonth, 0).getDate(); /* 算出這個月有幾天 */

        for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div class="day-cell empty"></div>`;

        for (let d = 1; d <= daysInMonth; d++) {
            const isToday = (d === now.getDate() && viewMonth === (now.getMonth() + 1) && viewYear === now.getFullYear()) ? 'today' : '';
            const isDone = localStorage.getItem(`done_${viewYear}_${viewMonth}_${d}`) ? 'done' : ''; /* 確認是否已完成 */
            grid.innerHTML += `<div class="day-cell ${isToday} ${isDone}" onclick="openDetail(${d})">${d}</div>`;
        }
        document.getElementById('cal-label').innerText = `${viewYear}年 ${viewMonth}月`;
    }

    // 月曆月份切換
    function changeMonth(delta) {
        viewMonth += delta;
        if (viewMonth > 12) { viewMonth = 1; viewYear++; }
        else if (viewMonth < 1) { viewMonth = 12; viewYear--; }
        renderCalendar();
    }

    // 日記日期切換
    function changeDiaryDate(daysDelta) {
        diaryDate.setDate(diaryDate.getDate() + daysDelta);
        renderDiaryPage();
    }

    // 渲染與更新日記頁面資料
    function renderDiaryPage() {
        const y = diaryDate.getFullYear();
        const m = diaryDate.getMonth() + 1;
        const d = diaryDate.getDate();

        document.getElementById('diary-date-label').innerText = `${y}年 ${m}月${d}日`;

        const key = `diary_${y}_${m}_${d}`;
        document.getElementById('diary-box').value = localStorage.getItem(key) || "";
    }

    // 日記即時打字存檔
    function saveDiaryContent() {
        const y = diaryDate.getFullYear();
        const m = diaryDate.getMonth() + 1;
        const d = diaryDate.getDate();
        
        const key = `diary_${y}_${m}_${d}`;
        localStorage.setItem(key, document.getElementById('diary-box').value);
    }

    // 匯出當前日記為本地文字檔 (.txt)
    function downloadDiaryAsFile() {
        const y = diaryDate.getFullYear();
        const m = diaryDate.getMonth() + 1;
        const d = diaryDate.getDate();
        const diaryText = document.getElementById('diary-box').value;
        
        if (diaryText.trim() === "") {
            alert("今天還沒有寫任何日記內容喔！");
            return;
        }
        
        const fileContent = `【SJPCT 靈修隨身本 - 靈修日記】\n日期：${y}年 ${m}月 ${d}日\n---------------------------\n\n${diaryText}`;
        const blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });
        const tempLink = document.createElement("a");
        tempLink.download = `${y}-${m}-${d}_靈修日記.txt`;
        tempLink.href = URL.createObjectURL(blob);
        tempLink.click();
        URL.revokeObjectURL(tempLink.href);
    }

    // 查詢經卷
    function searchBibleCustom() {
        let searchString = document.getElementById('bible-search-input').value.trim();
        if (searchString === "") {
            alert("請先輸入經卷與章節，例如：創 1");
            return;
        }
    
        if (!searchString.includes(' ')) {
            // 找到第一個出現數字或減號的地方，並在前面加空格
            searchString = searchString.replace(/([0-9\-\uFF10-\uFF19])/, ' $1');
        }
    
        fetchFHLBible(searchString);
    }

    // 解析進度表資料
    function parseBiblePlanString(str) {
        const tasks = [];
        const cleanStr = str.trim();

        // 檢查是否為跨書卷格式，例如 "民 36-申 1" 或 "撒下 24-王上 1"
        // 規則：[書卷A] [章A]-[書卷B] [章B]
        const crossBookMatch = cleanStr.match(/^([^\d\s]+)\s+(\d+)\s*-\s*([^\d\s]+)\s+(\d+)$/);

        if (crossBookMatch) {
            const bookA = crossBookMatch[1];
            const chapA = parseInt(crossBookMatch[2]);
            const bookB = crossBookMatch[3];
            const chapB = parseInt(crossBookMatch[4]);

            // 分別加入兩個書卷的對應章節任務
            tasks.push({ book: bookA, chap: chapA });
            tasks.push({ book: bookB, chap: chapB });
        } else {
            // 一般格式，例如 "創 1-2" 或 "約 21"
            const parts = cleanStr.split(' ');
            if (parts.length >= 2) {
                const book = parts[0];
                const range = parts[1];

                if (range.includes('-')) {
                    const [start, end] = range.split('-').map(Number);
                    for (let i = start; i <= end; i++) {
                        tasks.push({ book: book, chap: i });
                    }
                } else {
                    tasks.push({ book: book, chap: Number(range) });
                }
            }
        }
        return tasks;
    }

    // 串接經文
    async function fetchFHLBible(readingStr) {
        const bibleBody = document.getElementById('bible-body');
        const bibleTitle = document.getElementById('bible-title');
        
        if (readingStr === "休息") {
            bibleTitle.innerText = "今日休息";
            bibleBody.innerHTML = "今天是休息日，可以默想或是補上之前的進度。";
            return;
        }

        bibleTitle.innerText = `${readingStr} (和合本2010修訂版)`;
        bibleBody.innerHTML = `<div style="text-align:center; padding:20px; color:var(--secondary-color);">正在下載 2010和合本修訂版 經文...</div>`;

        try {
            // 解析出所有需要下載的書卷與章節任務
            const queryTasks = parseBiblePlanString(readingStr);
            
            if (queryTasks.length === 0) {
                bibleBody.innerHTML = "無法解析經文格式，請檢查輸入內容. ";
                return;
            }

            // 發送非同步請求
            const fetchPromises = queryTasks.map(task => {
                const url = `https://bible.fhl.net/json/qb.php?chineses=${encodeURIComponent(task.book)}&chap=${task.chap}&version=rcuv&strong=0&gb=0`;
                return fetch(url).then(res => res.json()).then(data => ({ task, data }));
            });

            const results = await Promise.all(fetchPromises);

            let html = "";
            let currentBook = "";

            results.forEach(({ task, data }) => {
                if (data.record && data.record.length > 0) {
                    // 切換書卷時（例如民數記換到申命記），動態補上書卷的大標題
                    if (currentBook !== task.book) {
                        currentBook = task.book;
                        html += `<h3 style="color:var(--accent-color); margin-top:25px; border-bottom:2px solid var(--accent-color); padding-bottom:5px;">${currentBook}</h3>`;
                    }
                    
                    html += `<h4 class="chap-title">第 ${data.record[0].chap} 章</h4>`;
                    
                    const records = data.record;
                    for (let i = 0; i < records.length; i++) {
                        const currentVerse = records[i];
                        const textTrim = currentVerse.bible_text.trim().toLowerCase();

                        // 只判斷經文內容(bible_text)去除前後空白後是不是a
                        if (textTrim === 'a') {
                            html += `<p><span class="verse-num">${currentVerse.sec}</span><span style="color: var(--secondary-color); font-size: 1.05rem; font-weight: bold;">(併於上節)</span></p>`;
                        } else {
                            html += `<p><span class="verse-num">${currentVerse.sec}</span>${currentVerse.bible_text}</p>`;
                        }
                    }
                }
            });

            // 在最後加上「今日進度已完成」的快捷按鈕
            if (html) {
                const key = `done_${viewYear}_${viewMonth}_${selectedDay}`;
                const isDone = localStorage.getItem(key);
                const btnText = isDone ? "今日進度已達成 ✓" : "標記今日進度已完成";
                const btnClass = isDone ? "btn-action btn-complete is-done" : "btn-action btn-complete";

                html += `
                    <div style="margin-top: 30px; border-top: 1px solid var(--secondary-color); padding-top: 20px;">
                        <button id="bible-quick-done-btn" class="${btnClass}" onclick="markCurrentReadingAsDone()">
                            ${btnText}
                        </button>
                    </div>
                `;
            }

            bibleBody.innerHTML = html || "找不到經文內容，請檢查格式。";
        } catch (error) {
            bibleBody.innerHTML = "經文連線失敗，請檢查網路狀態。";
        }
    }

    // 在閱讀頁面直接標記已完成的快捷函式
    function markCurrentReadingAsDone() {
        const key = `done_${viewYear}_${viewMonth}_${selectedDay}`;
        const btn = document.getElementById('bible-quick-done-btn');
        
        if (localStorage.getItem(key)) {
            // 原本已完成 -> 取消完成
            localStorage.removeItem(key);
            btn.innerText = "標記今日進度已完成";
            btn.className = "btn-action btn-complete";
        } else {
            // 原本未完成 -> 標記為完成
            localStorage.setItem(key, "true");
            btn.innerText = "今日進度已達成 ✓";
            btn.className = "btn-action btn-complete is-done";
        }
        
        // 即時刷新背景月曆格子顏色
        renderCalendar();
    }

    // 月曆格子點擊事件
    function openDetail(d) {
        selectedDay = d;
        const reading = biblePlan[viewMonth]?.[d] || "休息";
        document.getElementById('modal-date').innerText = `${viewMonth}月${d}日`;
        document.getElementById('modal-reading').innerText = reading;
        
        const isDone = localStorage.getItem(`done_${viewYear}_${viewMonth}_${d}`);
        const btn = document.getElementById('modal-btn');
        btn.innerText = isDone ? "已達成" : "標記為已達成";
        btn.className = isDone ? "btn-action btn-complete is-done" : "btn-action btn-complete";
        
        document.getElementById('modal').style.display = 'flex';
        
        // 點開格子時，順便在背景開始下載經文
        fetchFHLBible(reading);
    }

    function switchToBible() {
        closeModal();
        switchPage('bible', document.getElementById('nav-bible'));
    }

    // 從彈窗跳轉至該日的日記頁面
    function switchToDiary() {
        closeModal();
        diaryDate = new Date(viewYear, viewMonth - 1, selectedDay);
        renderDiaryPage();
        switchPage('diary', document.getElementById('nav-diary'));
    }

    // 彈出視窗的標記完成
    function toggleComplete() {
        const key = `done_${viewYear}_${viewMonth}_${selectedDay}`;
        localStorage.getItem(key) ? localStorage.removeItem(key) : localStorage.setItem(key, "true");
        renderCalendar();
        closeModal();
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function switchPage(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active-nav'));
        btn.classList.add('active-nav');
    }

    // 控制經文的字體大小
    function changeBibleFontSize(sizeString, activeType) {
        document.getElementById('bible-body').style.fontSize = sizeString;

        document.getElementById('font-btn-normal').style.background = 'var(--secondary-color)';
        document.getElementById('font-btn-large').style.background = 'var(--secondary-color)';
        document.getElementById('font-btn-xlarge').style.background = 'var(--secondary-color)';

        if (activeType === 'normal') {
            document.getElementById('font-btn-normal').style.background = 'var(--accent-color)';
        }
        if (activeType === 'large') {
            document.getElementById('font-btn-large').style.background = 'var(--accent-color)';
        }
        if (activeType === 'xlarge') {
            document.getElementById('font-btn-xlarge').style.background = 'var(--accent-color)';
        }
    }

    // 啟動與初始化
    initData();
    renderCalendar();
    renderDiaryPage();
</script>

</body>
</html>
